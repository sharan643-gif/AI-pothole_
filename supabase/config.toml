# RoadGuard AI — Supabase project configuration
# Docs: https://supabase.com/docs/guides/local-development/cli/config

project_id = "roadguard-ai"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "15MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[realtime]
enabled = true

# ---------------------------------------------------------------------
# Edge Functions
#
# Secrets are NOT stored here. Set them with:
#   supabase secrets set GEMINI_API_KEY=... MAPBOX_SECRET_TOKEN=...
# ---------------------------------------------------------------------
[functions.analyze-pothole]
verify_jwt = false

[functions.assign-officer]
verify_jwt = false

[functions.calculate-priority]
verify_jwt = false

[functions.verify-repair]
verify_jwt = false

[functions.road-insights]
verify_jwt = false

[functions.reverse-geocode]
verify_jwt = false
